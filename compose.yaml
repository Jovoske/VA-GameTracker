name: gamesense

x-backend: &backend
  build:
    context: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gamesense}:${POSTGRES_PASSWORD:-gamesense}@db:5432/${POSTGRES_DB:-gamesense}
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./backend:/app
    - media:/data/media
    - models:/data/models
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    build:
      context: ./docker/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gamesense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamesense}
      POSTGRES_DB: ${POSTGRES_DB:-gamesense}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gamesense}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    <<: *backend
    command: api
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *backend
    command: worker

  beat:
    <<: *backend
    command: beat

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY: http://api:8000
    ports:
      - "${WEB_PORT:-8080}:5173"
    depends_on:
      - api

volumes:
  pgdata:
  media:
  models:
